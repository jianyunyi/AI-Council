name: release-images
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AICOUNCIL_RELEASE_TAG: ${{ github.sha }}
      COUNCIL_BOOTSTRAP_SUBJECT: release-smoke
      COUNCIL_BOOTSTRAP_PASSWORD: synthetic-release-smoke-password
      RUNNER_TOKEN: synthetic-release-smoke-runner-token-0123456789
      AICOUNCIL_BACKUP_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AICOUNCIL_APPROVAL_SIGNING_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      TLS_CERT: /certs/validation.crt
      TLS_KEY: /certs/validation.key
      TLS_CERT_DIRECTORY: /tmp/aicouncil-certs
      WORKSPACE_DIRECTORY: /tmp/aicouncil-workspaces
      PUBLIC_BASE_URL: https://localhost
      GITHUB_OAUTH_CLIENT_ID: release-smoke-client
      GITHUB_OAUTH_CLIENT_SECRET: synthetic-release-smoke-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run Go tests before building release images
        run: go test ./...
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Council image (local, not yet published)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.council
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/aicouncil-council:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build Runner image (local, not yet published)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/aicouncil-runner:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build Web image (local, not yet published)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/aicouncil-web:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Prepare ephemeral Compose smoke environment
        shell: bash
        run: |
          mkdir -p "$TLS_CERT_DIRECTORY" "$WORKSPACE_DIRECTORY"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TLS_CERT_DIRECTORY/validation.key" -out "$TLS_CERT_DIRECTORY/validation.crt" -subj /CN=localhost -days 1
          cat > deploy/release-smoke.override.yml <<'YAML'
          services:
            web:
              image: ghcr.io/${{ github.repository_owner }}/aicouncil-web:${{ github.sha }}
            council:
              image: ghcr.io/${{ github.repository_owner }}/aicouncil-council:${{ github.sha }}
            runner:
              image: ghcr.io/${{ github.repository_owner }}/aicouncil-runner:${{ github.sha }}
          YAML
      - name: Start locally built images
        run: |
          docker compose -p aicouncil-release -f deploy/docker-compose.yml -f deploy/release-smoke.override.yml up -d --no-build
      - name: Smoke published release
        shell: pwsh
        run: >-
          ./deploy/smoke-test.ps1
          -BaseUrl https://localhost
          -AdminSubject $env:COUNCIL_BOOTSTRAP_SUBJECT
          -AdminPassword $env:COUNCIL_BOOTSTRAP_PASSWORD
          -ProjectName aicouncil-release
          -ComposeFiles @('deploy/docker-compose.yml','deploy/release-smoke.override.yml')
          -SkipCertificateCheck
      - name: Publish images only after smoke passed
        if: success()
        run: |
          for svc in council runner web; do
            docker push "ghcr.io/${{ github.repository_owner }}/aicouncil-${svc}:${{ github.sha }}"
          done
      - name: Stop disposable smoke stack and remove its data
        if: always()
        run: |
          docker compose -p aicouncil-release -f deploy/docker-compose.yml -f deploy/release-smoke.override.yml down -v --remove-orphans || true
          rm -rf "$TLS_CERT_DIRECTORY" "$WORKSPACE_DIRECTORY"
          rm -f deploy/release-smoke.override.yml
