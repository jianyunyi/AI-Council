name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
  e2e:
    runs-on: ubuntu-latest
    needs: web
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web exec playwright test
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose build configuration
        shell: pwsh
        run: ./deploy/verify-compose-build-config.ps1
  images:
    runs-on: ubuntu-latest
    needs: [go, web, e2e, deployment]
    env:
      COUNCIL_BOOTSTRAP_SUBJECT: ci-validation
      COUNCIL_BOOTSTRAP_PASSWORD: validation-only-password
      RUNNER_TOKEN: validation-only-runner-token
      TLS_CERT: /certs/validation.crt
      TLS_KEY: /certs/validation.key
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment images
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml build
  release-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: images
    environment:
      name: production
    steps:
      - name: Write release readiness summary
        shell: bash
        run: |
          {
            echo "## Release readiness"
            echo
            echo "Validated commit: \`${{ github.sha }}\`"
            echo "This approval-gated job does not deploy or publish artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
